[server]
listening_address = 127.0.0.1
listening_port = 3202
server_url = "http://localhost:3202"
server_prefix = /media

[auth]
system_users = { "admin": [ 4, "$1$1586de76f5f26e8a6dbbe05182e4dc94$", [ "admin", "delegate" ], "./keys/mediapriv.pem" ], "devmanager": [ 101, "$1$1586de76f5f26e8a6dbbe05182e4dc94$", [ "auth", "producer" ], "./keys/ed25519_rudiprodmanager-shared.pub" ] }
media_priv_keyfile = ./keys/mediapriv.pem

[database]
disabled = false
db_url = mongodb://127.0.0.1:27017/
db_name = rudi_media

[storage]
media_dir = ./media
acc_timeout = 20
zones = [ { "name":"zone_A", "staging_time":15, "destroy_time":20 }, { "name":"zone_51" }, { "name":"zone_bp", "path":"./_media", "csv":"list.csv", "abspath":true } ]

[log_server]
path = /dev/log
transport= 5 // TCP=1, UNIX=4
retryTimeout = 60000
rfc3164 = true

[log_local]
consoleData= false

[logging]
app_name = media-local
