stages:
  - install_dev
  - quality_dev
  - install_prod
  - pack_prod

# This folder is cached between builds
default:
  cache:
    paths:
      - node_modules/
  before_script:
    - |
      {
        echo "@aqmo.org:registry=${CI_API_V4_URL}/projects/59/packages/npm/"
        echo "${CI_API_V4_URL#https?}/projects/59/packages/npm/:_authToken=\${CI_JOB_TOKEN}"
      } | tee -a .npmrc

install:dev:
  stage: install_dev
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
      when: always
    - if: '$CI_PIPELINE_SOURCE != "push"'
      when: manual
  tags:
    - nodejs-20
  cache:
    - key:
        files: [./package-lock.json]
      paths: [./node_modules/]
  variables:
    NODE_ENV: development
  script:
    - npm i

quality:dev:
  stage: quality_dev
  needs: [install:dev]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
      when: always
    - if: '$CI_PIPELINE_SOURCE != "push"'
      when: manual
  cache:
    - key:
        files: [./package-lock.json]
      paths: [./node_modules/]
  tags:
    - nodejs-20
  variables:
    NODE_ENV: production
  script:
    # - npm run prettify
    - npm run lint

install:prod:
  stage: install_prod
  needs: [quality:dev]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
      when: always
    - if: '$CI_PIPELINE_SOURCE != "push"'
      when: manual
  tags:
    - nodejs-20
  variables:
    NODE_ENV: production
  script:
    - npm i

pack:prod:
  stage: pack_prod
  needs: [install:prod]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
      when: always
    - if: '$CI_PIPELINE_SOURCE != "push"'
      when: manual
  tags:
    - nodejs
  variables:
    NODE_ENV: production
  script:
    - npm pack
  artifacts:
    name: 'rudi_media.tgz'
    when: on_success
    paths:
      - ./rudi_media_drv-*.tgz
